<style>

  --steel-900:#1B2127;
  --steel-700:#3C4750;
  --steel-500:#6B7780;
  --steel-300:#AEB7BD;
  --steel-150:#D3D8DB;
  --shell:#DCE0E2;
  --paper:#FCFCFA;
  --brass:#A97C26;
  --brass-soft:#F4EBD5;
  --alarm:#A5302A;
  --alarm-soft:#F6E4E2;
  --verdigris:#2D6A5D;
  --verdigris-soft:#E1EDEA;

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--shell);
  color:var(--steel-900);
  font-family:var(--sans);

button{font:inherit;color:inherit;cursor:pointer}

/* ---------- shell ---------- */
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.screen{padding:40px 0 90px}

/* ---------- exam bar ---------- */
#bar{
  position:sticky;top:0;z-index:40;
  background:var(--steel-900);color:#EDF0F1;
  display:none;
}
#bar.on{display:block}
.bar-in{
  max-width:1000px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.bar-where{font-size:14px;line-height:1.3}
.bar-where b{font-weight:600;letter-spacing:.005em}
.bar-where span{display:block;color:#9AA5AC;font-size:13px}
.clock{
  font-size:34px;font-weight:600;letter-spacing:.01em;
  font-variant-numeric:tabular-nums;line-height:1;
}
.clock.low{color:#F0A7A1}
.clock-note{font-size:12px;color:#9AA5AC;text-align:right;margin-top:3px}
#drain{height:3px;background:#2C343B}
#drain i{display:block;height:100%;width:100%;background:var(--brass);transition:width 1s linear}
#drain i.low{background:var(--alarm)}
@media (prefers-reduced-motion:reduce){#drain i{transition:none}}

/* ---------- type ---------- */
h1{font-size:30px;line-height:1.15;margin:0 0 10px;font-weight:600;letter-spacing:-.012em}
h2{font-size:21px;line-height:1.25;margin:0 0 10px;font-weight:600}
h3{font-size:16px;margin:0 0 8px;font-weight:600}
p{margin:0 0 12px}

.muted{color:var(--steel-500);font-size:14px}
.rule{height:1px;background:var(--steel-150);border:0;margin:26px 0}

.spec{width:100%;border-collapse:collapse;margin-top:6px;font-size:15px}
.spec th,.spec td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--steel-150);vertical-align:top}
.spec th{font-weight:600;color:var(--steel-700);font-size:13px;border-bottom:1px solid var(--steel-300)}
.spec td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.spec tr.pending td{color:var(--steel-500)}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0 8px}
.mode{

}
.mode:hover{border-color:var(--brass)}
.mode b{display:block;font-size:17px;margin-bottom:4px}

.optline{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:14px;color:var(--steel-700)}

.warn{background:var(--brass-soft);border-left:3px solid var(--brass);padding:14px 16px;font-size:14.5px;margin:20px 0}

}
.btn:hover{background:#000}
.btn.ghost{background:transparent;color:var(--steel-900);border-color:var(--steel-300)}

select#switcher{font:inherit;font-size:14px;padding:9px 10px;background:#fff;border:1px solid var(--steel-300);color:var(--steel-900);max-width:220px}

.qnum{font-size:13px;font-weight:600;color:var(--brass);font-variant-numeric:tabular-nums}
.qstem{font-size:17.5px;line-height:1.45;margin:0 0 18px;max-width:70ch}
.qstem .calc{font-variant-numeric:tabular-nums;font-size:20px;letter-spacing:.01em}
.series{font-size:22px;letter-spacing:.06em;font-variant-numeric:tabular-nums;margin:0 0 18px}
.series u{text-decoration:none;border-bottom:2px solid var(--brass);padding:0 12px}

  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--paper);border:1px solid var(--steel-150);border-left:3px solid transparent;
  padding:12px 14px;margin-bottom:7px;font-size:16px;line-height:1.4;
}
.opt:hover{border-color:var(--steel-300);border-left-color:var(--steel-300)}
.opt .ltr{
  flex:0 0 24px;height:24px;border:1px solid var(--steel-300);border-radius:50%;

var PASSAGES = {
p1:{t:"Isolating energy before service",b:[
"Before any maintenance is performed on powered equipment, the energy that drives that equipment must be isolated and secured. The procedure that accomplishes this is commonly called lockout/tagout. Lockout refers to the physical device, usually a padlock, that holds an energy-isolating switch or valve in the off position. Tagout refers to the written warning attached to that device, identifying the worker who applied it and the date it was applied. A tag alone provides information but no physical restraint, so a tag is never treated as a substitute for a lock when the isolating device can accept one.",
"Energy is not limited to electricity. A machine may store energy in compressed springs, in elevated components held up by gravity, in pressurized hydraulic or pneumatic lines, or in residual heat. Each of these must be released, blocked, or allowed to dissipate before the work begins. A common failure is to open the main disconnect and assume the equipment is safe, only to have a raised platform descend when a hydraulic line is loosened.",
"The worker who applies a lock is the only worker permitted to remove it. When several people work on the same machine, each applies a personal lock to a group lockout device, and the machine cannot be re-energized until the last lock is gone. If a worker leaves the site without removing a lock, the removal requires written authorization from a supervisor plus a documented attempt to contact the absent worker.",
"Before work starts, the isolation must be verified. Verification means attempting to start the equipment through its normal controls, confirming that nothing moves, and then returning the controls to the off position."]},

p2:{t:"Two materials for water distribution",b:[
"Two materials dominate residential water distribution: rigid copper tube and cross-linked polyethylene, known as PEX. Each has properties that make it preferable in particular situations.",
"Copper is joined by soldering, brazing, or mechanical press fittings. It tolerates high temperatures, resists ultraviolet light, and can be installed outdoors or in exposed locations without degrading. Because it is rigid, a copper system holds its shape and supports itself between hangers. Copper is also comparatively expensive, and its price moves with commodity markets. Water that is unusually acidic can corrode copper from the inside over a period of years, producing pinhole leaks.",
"PEX is flexible and is joined with crimp rings, expansion fittings, or push-fit connectors, none of which require an open flame. A single length of PEX can be routed around obstacles that would demand several soldered elbows in copper, and fewer joints means fewer places for a leak to start. PEX also tolerates freezing better than copper, expanding rather than splitting, though repeated freezing still shortens its life. Its weaknesses are ultraviolet degradation, which makes it unsuitable for prolonged sunlight exposure, and permeability, which means it should not be run through soil contaminated with solvents.",
"Cost and labor time generally favor PEX in new construction. Copper remains common in commercial work and in repairs to existing copper systems, where mixing materials introduces transition fittings and additional failure points.",
"Neither material is universally correct. The selection depends on water chemistry, exposure, temperature, local code, and the skill set of the installing crew."]},

p3:{t:"Setting and climbing a portable ladder",b:[
"A portable ladder fails in one of three ways: it slides at the base, it tips sideways, or the person on it loses balance. Setup procedures address all three.",
"An extension ladder leaning against a wall should be set so that the base is one foot out from the wall for every four feet of working height. A ladder reaching a roof edge twenty feet above the ground therefore sits five feet from the building. An angle steeper than this increases the chance the ladder will tip backward; a shallower angle increases the chance the base will slide out.",
"When a ladder is used to reach a roof or platform, it must extend at least three feet above the landing surface so the climber has something to hold while stepping off. The top of the ladder should be secured whenever the work will last more than a few minutes.",
"Climbers should face the ladder and maintain three points of contact: two hands and one foot, or two feet and one hand. This rule makes carrying tools by hand impractical, which is why tools are hoisted separately or carried in a belt.",
"Every ladder carries a duty rating that states the maximum combined weight of the user, clothing, tools, and materials. The rating is not a weight limit for the person alone. A worker weighing 200 pounds carrying 60 pounds of equipment exceeds a ladder rated at 250 pounds."]},

p4:{t:"Protecting a water supply from backflow",b:[
"A cross-connection is any point where the potable water supply can come into contact with a source of contamination. Backflow is the movement of water through such a connection in the wrong direction, from the contaminated side into the drinking water side.",
"Backflow occurs for one of two reasons. Back-siphonage happens when pressure in the supply line drops below the pressure at the fixture, usually because a water main breaks or a fire department draws heavily from a hydrant. The falling pressure creates suction that pulls water backward. Back-pressure happens when the downstream system is pressurized above the supply, by a boiler, a pump, or an elevated tank, and pushes water back toward the main.",
"The simplest protection is an air gap: a vertical open space between the water outlet and the flood rim of the receiving vessel. Because no continuous path exists, no siphon can form. An air gap should be at least twice the diameter of the supply pipe, and never less than one inch.",
"Where an air gap is impractical, mechanical devices are installed. A vacuum breaker admits air into the line when pressure drops, breaking the siphon; it protects against back-siphonage only. A reduced-pressure zone assembly uses two check valves with a relief valve between them, and protects against both back-siphonage and back-pressure.",
"Mechanical devices contain moving parts that wear, and most jurisdictions require annual testing by a certified tester. An air gap, having no moving parts, requires only that nothing be placed in the gap and that the arrangement remain undisturbed."]},

p5:{t:"What a torque wrench measures",b:[
"A torque wrench measures the rotational force applied to a fastener. Torque matters because a bolt does its work by stretching: as the bolt is tightened it elongates slightly, and the tension in the stretched bolt clamps the joint together. Too little torque leaves the joint loose enough to work itself apart under vibration. Too much torque stretches the bolt past its elastic limit, at which point it no longer springs back and the clamping force is lost even though the bolt feels tight.",
"Three common types are in use. A beam wrench uses a pointer over a scale and is read while force is applied; it is inexpensive and nearly impossible to knock out of calibration, but it must be viewed straight on to be read correctly. A click wrench is preset to a value and produces an audible and tactile click at that value; it is faster, but it must be returned to its lowest setting when stored, because leaving the internal spring compressed shifts its calibration over time. A digital wrench displays a reading and can record a sequence of values, at the cost of batteries and price.",
"Readings are affected by friction. A dry fastener and a lubricated fastener reach very different tensions at the same torque figure, so a specification is only meaningful when the stated lubrication condition is followed. An adapter that moves the fastener farther from the handle along the line of the wrench changes the effective lever arm and requires the setting to be recalculated. An adapter set at a right angle to the wrench does not."]},

p6:{t:"Why insulation is sealed on cold lines",b:[
"Heat always moves from a warmer body to a cooler one, by conduction, convection, or radiation. Pipe insulation is installed to slow that movement, and its usefulness is measured by R-value, the resistance of a material to conductive heat flow. A higher R-value means slower heat transfer. R-values of layers in series add, so two inches of a material rated R-4 per inch provide R-8.",
"On hot lines, insulation keeps heat in the water, so a shower draws hot water sooner and the boiler cycles less often. On cold lines, insulation serves a different purpose. Air holds a limited amount of water vapor, and the amount falls as the air cools. When warm humid air touches a cold pipe, the air immediately at the surface cools below the point where it can hold its moisture, and the excess condenses on the pipe. The resulting drip is often mistaken for a leak. Insulation keeps the surface temperature above that point and prevents the condensation.",
"For this to work, the insulation on a cold line must be sealed. If humid air reaches the pipe through a gap at a seam or fitting, condensation forms underneath the insulation, where it cannot evaporate. The water then saturates the insulation, destroying its R-value, and stays in contact with the pipe. On a steel line, the result is corrosion that continues out of sight.",
"Hot lines are more forgiving of small gaps, because no condensation mechanism operates there. A gap simply reduces efficiency at that point rather than starting damage."]},

p7:{t:"Entering a confined space",b:[
"A confined space is defined by three characteristics taken together: it is large enough for a worker to enter and perform work, it has limited means of entry or exit, and it is not designed for continuous occupancy. A tank, a sewer, a manhole, a pit, and a crawlspace can all qualify. Size alone does not determine the classification. A space the size of a room can be a confined space if its only opening is a hatch.",
"A confined space becomes a permit-required confined space if it also contains or could contain a hazardous atmosphere, a material that could engulf a worker, walls that converge or floors that slope to a smaller cross-section, or any other recognized serious hazard.",
"Atmospheric testing is performed before entry and in a fixed order: oxygen first, then flammable gases, then toxic contaminants. The order matters because the instruments that detect flammable gas rely on a known oxygen level to give an accurate reading. Testing is done from outside the space, lowering the probe through the opening in stages rather than sampling only at the top, since heavier-than-air gases collect at the bottom.",
"Every permit entry requires an attendant stationed outside who maintains contact with the entrants, monitors conditions, and orders evacuation when necessary. The attendant does not enter to perform a rescue. A substantial share of confined-space fatalities are would-be rescuers who entered without equipment in response to a collapsed coworker, and the prohibition exists because of that pattern."]}
};

    "e": "The paper is folded 3 times: the bottom half folded up onto the top; then the left half folded over onto the right; then the top half folded down onto the bottom. A single punch goes through 8 layers, so the opened sheet shows 8 holes. Work the folds backwards, last one first: reflect it back up across the horizontal crease. Then reflect it back across the vertical crease to the left. Then reflect it back down across the horizontal crease. Each reflection doubles the holes you already have, which is the check on your answer: 1 then 2 then 4 then 8. The choices that show a different count can be eliminated on sight; the rest differ only in which side of a crease the holes land on."

\" y2=\"181\" stroke=\"var(--steel-500)\" stroke-width=\"1.3\"/><text x=\"245\" y=\"194\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"500\" fill=\"var(--steel-700)\">?</text></svg>",

ine x1=\"178\" y1=\"112\" x2=\"178\" y2=\"126\" stroke=\"var(--steel-900)\" stroke-width=\"2.4\"/><rect x=\"142\" y=\"126\" width=\"72\" height=\"46\" fill=\"#E3E7E9\" stroke=\"var(--steel-900)\" stroke-width=\"2\"/><text x=\"178\" y=\"154\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"var(--steel-900)\">100 lb</text></svg>",

" fill=\"#fff\" stroke=\"var(--steel-900)\" stroke-width=\"1.8\"/><circle cx=\"228\" cy=\"135\" r=\"11\" fill=\"#fff\" stroke=\"var(--steel-900)\" stroke-width=\"1.8\"/><line x1=\"161\" y1=\"66\" x2=\"161\" y2=\"118\" stroke=\"var(--steel-900)\" stroke-width=\"2.2\"/><line x1=\"183\" y1=\"66\" x2=\"183\" y2=\"118\" stroke=\"var(--steel-900)\" stroke-width=\"2.2\"/><line x1=\"217\" y1=\"66\" x2=\"217\" y2=\"118\" stroke=\"var(--steel-900)\" stroke-width=\"2.2\"/><line x1=\"239\" y1=\"66\" x2=\"239\" y2=\"118\" stroke=\"var(--steel-900)\" stroke-width=\"2.2\"/><path d=\"M 254 49 L 300 49 L 300 150\" fill=\"none\" stroke=\"var(--brass)\" stroke-width=\"2.4\" marker-end=\"url(#ahd)\"/><text x=\"316\" y=\"120\" text-anchor=\"start\" font-size=\"15\" font-weight=\"700\" fill=\"var(--brass)\">F</text><line x1=\"200\" y1=\"152\" x2=\"200\" y2=\"164\" stroke=\"var(--steel-900)\" stroke-width=\"2.4\"/><rect x=\"160\" y=\"164\" width=\"80\" height=\"40\" fill=\"#E3E7E9\" stroke=\"var(--steel-900)\" stroke-width=\"2\"/><text x=\"200\" y=\"189\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"var(--steel-900)\">200 lb</text><text x=\"72\" y=\"96\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"500\" fill=\"var(--steel-700)\">four rope</text><text x=\"72\" y=\"112\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"500\" fill=\"var(--steel-700)\">sections</text><line x1=\"108\" y1=\"92\" x2=\"152\" y2=\"92\" stroke=\"var(--steel-500)\" stroke-width=\"1.2\" marker-end=\"url(#ahd)\"/></svg>",
    "o": [
     "2 feet",
     "4 feet",
     "8 feet",
     "16 feet"
    ],
    "a": 2,
    "e": "Whatever a tackle divides in force it multiplies in distance, because the work put in cannot be less than the work got out. Four supporting sections means the pull is a quarter of the load, so the rope travels four times as far: 4 &times; 2 = 8 feet. Each of the four sections has to shorten by 2 feet, and that shortening comes off the free end."

/* ==================== state ==================== */
var S = {
  mode:null, si:0, qi:0, ans:{}, locked:[], checked:{},
  left:0, total:0, tick:null, started:false, done:false, perSection:false
};
SECTIONS.forEach(function(){S.locked.push(false)});

var LTR=["A","B","C","D","E","F"];
var app=document.getElementById("app");
var bar=document.getElementById("bar");
var navbar=document.getElementById("navbar");
var pal=document.getElementById("pal");

function qid(si,qi){return SECTIONS[si].id+"-"+qi}
function mmss(s){s=Math.max(0,s);var m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x}

/* ==================== screens ==================== */
function home(){
  stopClock(); bar.className=""; navbar.className="navbar";
  var rows=""; var hdr="<tr><th>&nbsp;</th><th>Section</th><th>Items</th><th>Time</th></tr>";
  SECTIONS.forEach(function(sec){
    rows+="<tr><td class='n'>"+sec.n+"</td><td>"+sec.name+"</td><td class='n'>"+sec.count+"</td>"+
      "<td class='n'>"+sec.mins+" min</td></tr>";
  });
  var totQ=0,totM=0; SECTIONS.forEach(function(s){totQ+=s.count;totM+=s.mins});

  app.innerHTML="<div class='wrap'><div class='screen'>"+
  "<div class='hero'>"+
    "<h1>GAN Aptitude Battery</h1>"+
    "<p class='lede'>A full-length practice sitting for the UA Plumbers Local 130 apprenticeship test. Same section order, same counts, same clocks, same conditions.</p>"+
    "<hr class='rule'>"+
    "<table class='spec'>"+hdr+rows+"</table>"+
    "<p class='muted' style='margin-top:14px'>"+totQ+" items, "+totM+" minutes of testing time, plus the reading of instructions between sections.</p>"+
  "</div>"+

  "<div class='warn'><b>No calculator.</b> There is no calculator in this tool and none is allowed at the real test. Work on paper. Have scratch paper and a pencil in front of you before you start, the same way you will at the testing center.</div>"+

  "<div class='modes'>"+
    "<button class='mode' onclick=\"begin('timed')\"><b>Take it timed</b><span>Each section runs its own clock. When a section's time is called it locks and you move on. No going back. This is the one that tells you where you stand.</span></button>"+
    "<button class='mode' onclick=\"begin('practice')\"><b>Work it untimed</b><span>No clocks, move anywhere, and check any answer as you go to see the worked solution. Use this after a timed run to clean up what you missed.</span></button>"+
  "</div>"+

  "<label class='optline'><input type='checkbox' id='persec'><span>Show my score at the end of each section. Off by default, since the real test gives you nothing until it is over, and a weak section can rattle you going into the next one. Turn it on when you are drilling rather than rehearsing.</span></label>"+

  "<hr class='rule'>"+
  "<div class='btnrow'>"+
    "<button class='btn ghost' onclick='printAll()'>Print the booklet and answer key</button>"+
  "</div>"+
  "<p class='muted' style='margin-top:16px;max-width:66ch'>Scoring is reported three ways: raw count correct per section, percentage, and an approximate 9-point band. The band is an estimate. GAN does not publish its scaling formula, and the real cut score is set by the JAC, not by the test vendor.</p>"+
  "</div></div>";
}

function begin(mode){
  S.mode=mode;
  var cb=document.getElementById("persec");
  S.perSection = cb ? cb.checked : false;
  S.si=0; S.qi=0; S.ans={}; S.checked={}; S.done=false;
  S.locked=SECTIONS.map(function(){return false});
  intro(0);
}

function intro(si){
  stopClock(); S.si=si; S.qi=0;
  bar.className=""; navbar.className="navbar";
  var sec=SECTIONS[si];
  app.innerHTML="<div class='wrap'><div class='screen'>"+
   "<div class='card' style='border-top:4px solid var(--brass);max-width:660px'>"+
     "<p class='muted' style='margin-bottom:4px'>Section "+sec.n+" of 6</p>"+
     "<h1>"+sec.name+"</h1>"+
     "<p class='lede'>"+sec.blurb+"</p>"+
     "<hr class='rule'>"+
     "<table class='spec'>"+
       "<tr><td>Items</td><td class='n'>"+sec.count+"</td></tr>"+
       "<tr><td>Time</td><td class='n'>"+(S.mode==="timed"? sec.mins+" minutes":"untimed")+"</td></tr>"+
       "<tr><td>Pacing</td><td>"+sec.pace+"</td></tr>"+
       "<tr><td>Calculator</td><td>Not permitted</td></tr>"+
     "</table>"+
     (S.mode==="timed"?"<div class='warn' style='margin-top:20px'>The clock starts when you press the button and does not pause. When it reaches zero this section locks and you move to the next one.</div>":"")+
     "<div class='btnrow' style='margin-top:22px'>"+
       "<button class='btn brass' onclick='startSection()'>"+(S.mode==="timed"?"Start the clock":"Start section")+"</button>"+
       (si===0?"<button class='btn ghost' onclick='home()'>Back</button>":"")+
     "</div>"+
   "</div>"+
  "</div></div>";
}

function startSection(){
  var sec=SECTIONS[S.si];
  S.qi=0;
  if(S.mode==="timed"){ S.total=sec.mins*60; S.left=S.total; startClock(); }
  bar.className="on"; navbar.className="navbar on";
  renderQ();
}

/* ==================== clock ==================== */
function startClock(){
  stopClock();
  S.tick=setInterval(function(){
    S.left--;
    paintClock();
    if(S.left<=0){ stopClock(); timeCalled(); }
  },1000);
  paintClock();
}
function stopClock(){ if(S.tick){clearInterval(S.tick);S.tick=null} }
function paintClock(){
  var c=document.getElementById("clock"), d=document.querySelector("#drain i");
  if(!c) return;
  if(S.mode!=="timed"){ c.textContent="--:--"; document.getElementById("clock-note").textContent="untimed practice"; d.style.width="100%"; return; }
  c.textContent=mmss(S.left);
  var low=S.left<=60;
  c.className="clock"+(low?" low":"");
  d.style.width=(100*S.left/S.total)+"%";
  d.className=low?"low":"";
  document.getElementById("clock-note").textContent=low?"under one minute":"time left in this section";
}

function timeCalled(){
  S.locked[S.si]=true;
  var o=document.createElement("div");
  o.className="overlay";
  o.innerHTML="<div class='box'><h2>Time called</h2><p>Section "+SECTIONS[S.si].n+", "+SECTIONS[S.si].name+", is closed. Anything unanswered is scored as a miss, exactly as it would be at the testing center.</p>"+
   "<div class='btnrow' style='margin-top:18px'><button class='btn brass' id='ov'>Continue</button></div></div>";
  document.body.appendChild(o);
  o.querySelector("#ov").focus();
  o.querySelector("#ov").onclick=function(){ o.remove(); afterSection(); };
}

/* ==================== question render ==================== */
function renderQ(){
  var sec=SECTIONS[S.si], q=sec.q[S.qi], id=qid(S.si,S.qi);
  document.getElementById("bar-sec").textContent="Section "+sec.n+" of 6: "+sec.name;
  document.getElementById("bar-q").textContent="Question "+(S.qi+1)+" of "+sec.count;
  paintClock();

  var locked = S.locked[S.si];
  var showAns = (S.mode==="practice" && S.checked[id]);
  var sel = S.ans[id];

  var opts="<ul class='opts"+(q.pf?" pf":"")+"'>";
  q.o.forEach(function(txt,i){
    var cls="opt";
    if(showAns){
      if(i===q.a) cls+=" right";
      else if(i===sel) cls+=" wrong";
    } else if(sel===i) cls+=" sel";
    opts+="<li><button class='"+cls+"' aria-pressed='"+(sel===i)+"' "+((locked||showAns)?"disabled":"")+" onclick='pick("+i+")'>"+
      "<span class='ltr'>"+LTR[i]+"</span><span class='txt'>"+txt+"</span></button></li>";
  });
  opts+="</ul>";

  var stem = q.ser
    ? "<p class='series'>"+q.ser.join(", ")+", <u>?</u></p><p class='muted' style='margin-top:-8px'>Which number continues the series?</p>"
    : "<p class='qstem"+(q.calc?"":"")+"'>"+(q.calc?"<span class='calc'>"+q.s+"</span>":q.s)+"</p>";

  var body="<div class='card'>"+
    "<div class='qhead'><span class='qnum'>Question "+(S.qi+1)+"</span>"+
    (locked?"<span class='verdict skip'>section closed</span>":"")+"</div>"+
    (q.fig?"<div class='fig'>"+q.fig+"</div>":"")+stem+opts+
    (showAns?"<div class='explain'><b>Worked solution</b>"+q.e+"</div>":"")+
    (S.mode==="practice"?"<div class='btnrow' style='margin-top:16px'>"+(showAns?"<button class='btn ghost' onclick='retry()'>Clear and try again</button>":"<button class='btn ghost' onclick='check()'"+(sel===undefined?" disabled":"")+">Check this answer</button>")+"</div>":"")+
  "</div>";

  if(q.p){
    var P=PASSAGES[q.p];
    var para=P.b.map(function(x){return "<p>"+x+"</p>"}).join("");
    app.innerHTML="<div class='wrap'><div class='screen'><div class='split'>"+
      "<div class='passage'><h3>"+P.t+"</h3>"+para+"</div><div>"+body+"</div>"+
    "</div></div></div>";
  } else {
    app.innerHTML="<div class='wrap'><div class='screen' style='max-width:640px'>"+body+"</div></div>";
  }
  paintPal();
}

function pick(i){
  if(S.locked[S.si]) return;
  S.ans[qid(S.si,S.qi)]=i;
  renderQ();
}
function check(){
  S.checked[qid(S.si,S.qi)]=true;
  renderQ();
}
function retry(){
  var id=qid(S.si,S.qi);
  delete S.checked[id]; delete S.ans[id];
  renderQ();
}

function paintPal(){
  var sec=SECTIONS[S.si], h="";
  for(var i=0;i<sec.count;i++){
    var c="chip";
    if(S.ans[qid(S.si,i)]!==undefined) c+=" done";
    if(i===S.qi) c+=" here";
    h+="<button class='"+c+"' onclick='jumpTo("+i+")' aria-label='Question "+(i+1)+"'>"+(i+1)+"</button>";
  }
  pal.innerHTML=h;
  var sw=document.getElementById("switcher");
  if(S.mode==="practice"){
    var sh="";
    SECTIONS.forEach(function(x,i){ sh+="<option value='"+i+"'"+(i===S.si?" selected":"")+">Section "+x.n+": "+x.name+"</option>" });
    sw.innerHTML=sh; sw.classList.remove("hide");
  } else { sw.classList.add("hide"); }
  document.getElementById("nav-prev").disabled = (S.qi===0);
  document.getElementById("nav-next").textContent = (S.qi===sec.count-1) ? "Finish section" : "Next";
}

function jumpTo(i){ S.qi=i; renderQ(); }
document.getElementById("nav-prev").onclick=function(){ if(S.qi>0){S.qi--;renderQ()} };
document.getElementById("switcher").onchange=function(){ S.si=parseInt(this.value,10); S.qi=0; renderQ(); };
document.getElementById("nav-next").onclick=function(){
  var sec=SECTIONS[S.si];
  if(S.qi<sec.count-1){ S.qi++; renderQ(); }
  else { confirmEnd(); }
};

function confirmEnd(){
  var sec=SECTIONS[S.si], miss=0;
  for(var i=0;i<sec.count;i++) if(S.ans[qid(S.si,i)]===undefined) miss++;
  var o=document.createElement("div");
  o.className="overlay";
  o.innerHTML="<div class='box' style='border-top-color:var(--brass)'><h2>Close this section?</h2>"+
   "<p>"+(miss? miss+" item"+(miss>1?"s are":" is")+" still blank. Blanks are scored as misses. There is no penalty for a guess, so fill them in before you close.":"Every item is answered.")+"</p>"+
   (S.mode==="timed"?"<p class='muted'>You will not be able to return to this section.</p>":"")+
   "<div class='btnrow' style='margin-top:18px'><button class='btn brass' id='yes'>Close section</button><button class='btn ghost' id='no'>Keep working</button></div></div>";
  document.body.appendChild(o);
  o.querySelector("#no").onclick=function(){o.remove()};
  o.querySelector("#yes").onclick=function(){ o.remove(); if(S.mode==="timed") S.locked[S.si]=true; stopClock(); afterSection(); };
}

/* ==================== between sections ==================== */
function afterSection(){
  if(S.perSection) sectionScore();
  else nextSection();
}
function nextSection(){
  if(S.si < SECTIONS.length-1) intro(S.si+1);
  else results();
}
function sectionScore(){
  stopClock(); bar.className=""; navbar.className="navbar";
  var sec=SECTIONS[S.si], r=scoreSection(S.si);
  app.innerHTML="<div class='wrap'><div class='screen'>"+
   "<div class='card' style='border-top:4px solid var(--brass);max-width:620px'>"+
    "<p class='muted' style='margin-bottom:4px'>Section "+sec.n+" closed</p>"+
    "<h1>"+sec.name+"</h1>"+
    "<div style='display:flex;gap:34px;align-items:flex-end;margin:18px 0 6px'>"+
      "<div><div class='big'>"+r.right+"<span style='font-size:24px;color:var(--steel-500)'>/"+sec.count+"</span></div><div class='bigsub'>correct</div></div>"+
      "<div><div class='big'>"+r.pct+"<span style='font-size:24px;color:var(--steel-500)'>%</span></div><div class='bigsub'>band "+r.band+" of 9, approximate</div></div>"+
    "</div>"+
    "<p class='muted'>"+r.blank+" left blank."+"</p>"+
    "<div class='btnrow' style='margin-top:20px'><button class='btn brass' onclick='nextSection()'>"+
      (S.si<SECTIONS.length-1 ? "Go to section "+SECTIONS[S.si+1].n : "See full results")+"</button></div>"+
   "</div></div></div>";
}

/* ==================== scoring ==================== */
function scoreSection(si){
  var sec=SECTIONS[si], right=0, blank=0;
  sec.q.forEach(function(q,i){
    var a=S.ans[qid(si,i)];
    if(a===undefined) blank++;
    else if(a===q.a) right++;
  });
  return {right:right,blank:blank,count:sec.count,
    pct:Math.round(100*right/sec.count), band:bandOf(100*right/sec.count)};
}
function bandOf(p){
  if(p>=96)return 9; if(p>=89)return 8; if(p>=77)return 7; if(p>=60)return 6;
  if(p>=40)return 5; if(p>=23)return 4; if(p>=11)return 3; if(p>=4)return 2; return 1;
}

function results(){
  stopClock(); S.done=true; bar.className=""; navbar.className="navbar";
  var tot=0,cnt=0,rows="";
  SECTIONS.forEach(function(sec,i){
    var r=scoreSection(i); tot+=r.right; cnt+=sec.count;
    rows+="<tr><td>"+sec.n+". "+sec.name+"</td>"+
      "<td class='n'>"+r.right+" / "+sec.count+"</td>"+
      "<td class='n'>"+r.pct+"%</td>"+
      "<td style='width:34%'><div class='bar-mini'><i style='width:"+r.pct+"%'></i></div></td>"+
      "<td class='n'>"+r.band+"</td></tr>";
  });
  var pct=Math.round(100*tot/cnt), band=bandOf(100*tot/cnt);
  var bandbar=""; for(var b=1;b<=9;b++){ bandbar+="<i class='"+(b===band?"on":(b<band?"b":""))+"' style='height:"+(8+b*3)+"px'></i>" }

  app.innerHTML="<div class='wrap'><div class='screen'>"+
   "<div class='scorehead'>"+
     "<div><div class='big'>"+tot+"<span style='font-size:26px;color:var(--steel-500)'>/"+cnt+"</span></div><div class='bigsub'>items correct across all six sections</div></div>"+
     "<div><div class='big'>"+pct+"<span style='font-size:26px;color:var(--steel-500)'>%</span></div><div class='bigsub'>overall</div></div>"+
     "<div><div class='band'>"+bandbar+"</div><div class='bigsub'>approximate band "+band+" of 9</div></div>"+
   "</div>"+
   "<div class='card'>"+
     "<table class='results-tbl'><tr><th>Section</th><th class='n'>Raw</th><th class='n'>Percent</th><th></th><th class='n'>Band</th></tr>"+rows+"</table>"+
     "<p class='muted' style='margin-top:16px;max-width:68ch'>The band is an approximation fitted to a normal curve. GAN does not publish its scaling, and Local 130's ranking also folds in the interview and, where it applies, direct-entry credit. Treat the band as a rough read on where you sit, and the raw counts as the thing to move.</p>"+
   "</div>"+
   "<div class='card'>"+
     "<h2>What to do with this</h2>"+
     "<p class='muted' style='max-width:68ch'>Read every explanation below, including the ones you got right, since a correct guess and a correct answer look identical on a score report and only one of them repeats. Then run the same sections untimed and see which misses were pace and which were method.</p>"+
     "<div class='btnrow' style='margin-top:16px'>"+
       "<button class='btn brass' onclick='review()'>Review every question</button>"+
       "<button class='btn ghost' onclick='printAll()'>Print booklet and key</button>"+
       "<button class='btn ghost' onclick='home()'>Start over</button>"+
     "</div>"+
   "</div>"+
  "</div></div>";
}

function review(){
  var h="<div class='wrap'><div class='screen'>"+
   "<div class='card' style='border-top:4px solid var(--brass)'><h1>Answer review</h1>"+
   "<p class='lede'>Every item, what you put, what was correct, and how to get there.</p></div>";
  SECTIONS.forEach(function(sec,si){
    h+="<div class='card'><h2>Section "+sec.n+": "+sec.name+"</h2>";
    sec.q.forEach(function(q,i){
      var a=S.ans[qid(si,i)];
      var v = a===undefined ? "<span class='verdict skip'>blank</span>"
            : a===q.a ? "<span class='verdict ok'>correct</span>"
            : "<span class='verdict no'>missed</span>";
      var stem = (q.ser ? "<span class='series' style='font-size:17px'>"+q.ser.join(", ")+", ?</span>" : q.s)
        + (q.fig?"<div class='fig' style='margin:12px 0 4px'>"+q.fig+"</div>":"");
      h+="<div class='review-q'><div class='qhead'><span class='qnum'>"+sec.n+"."+(i+1)+"</span>"+v+"</div>"+
        "<p style='margin:0 0 10px;font-size:16.5px'>"+stem+"</p>"+
        (q.pf
          ? "<div class='pf-review'>"+(a===undefined?"":"<figure><figcaption>You chose "+LTR[a]+"</figcaption>"+q.o[a]+"</figure>")+
            "<figure><figcaption>Correct, "+LTR[q.a]+"</figcaption>"+q.o[q.a]+"</figure></div>"
          : "<p class='muted' style='margin:0 0 8px'>"+
            (a===undefined?"You left this blank. ":"You chose "+LTR[a]+", "+optText(q,a)+". ")+
            "Correct answer: "+LTR[q.a]+", "+optText(q,q.a)+"."+"</p>")+
        "<div class='explain'><b>Why</b>"+q.e+"</div></div>";
    });
    h+="</div>";
  });
  h+="<div class='card'><div class='btnrow'><button class='btn ghost' onclick='results()'>Back to results</button>"+
     "<button class='btn ghost' onclick='printAll()'>Print booklet and key</button>"+
     "<button class='btn ghost' onclick='home()'>Start over</button></div></div>";
  h+="</div></div>";
  app.innerHTML=h;
  window.scrollTo(0,0);
}
function optText(q,i){ var t=stripTags(q.o[i]); return t?t:"the pattern shown as "+LTR[i]; }
function stripTags(s){var d=document.createElement("div");d.innerHTML=s;return d.textContent}

/* ==================== print ==================== */
function printAll(){
  var pr=document.getElementById("print-root");
  var h="<h1 style='margin:0 0 4px'>GAN Aptitude Battery &mdash; Practice Booklet</h1>"+
    "<p style='margin:0 0 4px'>UA Plumbers Local 130 apprenticeship. Six sections, 140 items, 119 minutes. No calculator.</p>"+
    "<p style='margin:0 0 18px'>"+SECTIONS.map(function(x){return x.name+" "+x.count+" items / "+x.mins+" min"}).join(" &nbsp;&bull;&nbsp; ")+"</p>";

  SECTIONS.forEach(function(sec){
    h+="<div class='p-sec'><h2>Section "+sec.n+": "+sec.name+"</h2><p><i>"+sec.blurb+"</i></p>";
    var lastP=null;
    sec.q.forEach(function(q,i){
      if(q.p && q.p!==lastP){
        lastP=q.p; var P=PASSAGES[q.p];
        h+="<div class='p-passage'><b>"+P.t+"</b>"+P.b.map(function(x){return "<p>"+x+"</p>"}).join("")+"</div>";
      }
      var stem = q.ser ? q.ser.join(", ")+", ____" : q.s;
      h+="<div class='p-q'><b>"+(i+1)+".</b> "+stem+"<br>";
      if(q.fig) h+="<div class='p-fig'>"+q.fig+"</div>";
      q.o.forEach(function(o,j){ h+=(q.pf?"<span class='p-ch'>("+LTR[j]+")"+o+"</span>":"&nbsp;&nbsp;("+LTR[j]+") "+o+"&nbsp;&nbsp;") });
      h+="</div>";
    });
    h+="</div>";
  });

  h+="<div class='p-sec'><h2>Answer key and worked solutions</h2><table class='p-key' style='width:100%;border-collapse:collapse'>";
  SECTIONS.forEach(function(sec){
    h+="<tr><th colspan='3' style='padding-top:12px'>Section "+sec.n+": "+sec.name+"</th></tr>";
    sec.q.forEach(function(q,i){
      h+="<tr><td style='width:34px'><b>"+(i+1)+".</b></td><td style='width:150px'>"+LTR[q.a]+" &mdash; "+optText(q,q.a)+"</td><td>"+q.e+"</td></tr>";
    });
  });
  h+="</table></div>";
  pr.innerHTML=h;
  window.print();
}

/* ==================== keyboard ==================== */
document.addEventListener("keydown",function(e){
  if(!document.querySelector(".opts")) return;
  if(document.querySelector(".overlay")) return;
  var k=e.key;
  if(k>="1"&&k<="5"){ var i=parseInt(k,10)-1; var sec=SECTIONS[S.si]; if(i<sec.q[S.qi].o.length){pick(i);e.preventDefault()} }
  else if(k==="ArrowRight"){ document.getElementById("nav-next").click(); e.preventDefault() }
  else if(k==="ArrowLeft"){ if(S.qi>0){S.qi--;renderQ()} e.preventDefault() }
});

window.addEventListener("beforeunload",function(e){
  if(S.mode&&!S.done){ e.preventDefault(); e.returnValue="" }
});

home();
</script>
</body>
</html>
